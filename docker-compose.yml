version: '3.8'

services:
  # Container do Banco de Dados PostgreSQL
  database:
    image: postgres:15-alpine
    container_name: auth_postgres_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: auth_database
    ports:
      - "5432:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data

  # Container da sua API Java (Spring Boot)
  api:
    build: . # Manda o Docker construir a imagem usando o Dockerfile da mesma pasta
    container_name: auth_spring_api
    depends_on:
      - database # Diz que a API só pode subir depois que o banco estiver pronto
    ports:
      - "8080:8080"
    environment:
      # O segredo está aqui! Sobrescrevemos o application.properties apontando pro container 'database'
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/auth_database
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: adminpassword
      # Você pode colocar as credenciais do seu e-mail aqui também para não ficarem expostas no código fonte:
      # SPRING_MAIL_USERNAME: seu.email@gmail.com
      # SPRING_MAIL_PASSWORD: sua-senha-de-app-gerada

volumes:
  auth_db_data: # Mantém os dados do banco salvos mesmo se o container for apagado